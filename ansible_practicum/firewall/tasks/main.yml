---
# tasks file for firewall
- name: Разрешить SSH с указанного IP
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ ip_remote_vm }}"

- name: Разрешить HTTP на вход
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    direction: in

- name: Разрешить HTTP на выход
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    direction: out

- name: Разрешить исходящие по умолчанию
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Запретить входящие по умолчанию
  community.general.ufw:
    direction: incoming
    default: deny

- name: Включить UFW
  community.general.ufw:
    state: enabled
