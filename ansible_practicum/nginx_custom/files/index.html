<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет мир от Данил Б.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            padding: 50px 70px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: floatUp 1s ease-out;
        }

        @keyframes floatUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 800;
            background: linear-gradient(90deg, #fff, #ffe066, #ff6b6b, #4ecdc4, #fff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            letter-spacing: 1px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        }

        @keyframes shine {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .subtitle {
            margin-top: 15px;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* Плавающие пузырьки */
        .bubble {
            position: absolute;
            bottom: -100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
            animation: rise linear infinite;
        }

        @keyframes rise {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет, мир, от Данила Борохтянова.</h1>
        <p class="subtitle">✨ Добро пожаловат!ь ✨</p>
    </div>

    <script>
        // Генерация декоративных пузырьков
        const colors = ['#ffe066', '#ff6b6b', '#4ecdc4', '#a29bfe', '#fd79a8'];
        for (let i = 0; i < 20; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 60 + 20;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = Math.random() * 100 + 'vw';
            bubble.style.animationDuration = (Math.random() * 8 + 6) + 's';
            bubble.style.animationDelay = Math.random() * 8 + 's';
            bubble.style.background = `radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), ${colors[Math.floor(Math.random() * colors.length)]}55)`;
            document.body.appendChild(bubble);
        }
    </script>
</body>
</html>
